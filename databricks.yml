bundle:
  name: advisor-risk-mlops

workspace:
  host: https://adb-5944275879339631.11.azuredatabricks.net

include:
  - resources/*.yml

# ── Variables ──────────────────────────────────────────────────────
# All environment-specific values are declared here and overridden
# per target. Notebooks receive them via job base_parameters;
# alert queries and registered_model reference them directly.
variables:
  catalog:
    description: Unity Catalog catalog for all tables and models
    default: mlops
  schema:
    description: Schema within the catalog
    default: siva_borusu
  model_name:
    description: Registered model name (without catalog.schema prefix)
    default: advisor_risk_model
  pyfunc_model_name:
    description: PyFunc wrapper model name (without catalog.schema prefix)
    default: advisor_risk_model_pyfunc
  endpoint_name:
    description: Model Serving endpoint name
    default: advisor-risk-model
  monitored_table:
    description: Inference log table monitored for drift / model quality (without catalog.schema prefix) — same as tables.evaluation in config.yaml
    default: advisor_risk_evaluation
  baseline_table:
    description: Quality monitor baseline table (training data scored by the trained model; same as tables.baseline in config.yaml)
    default: advisor_risk_baseline
  warehouse_id:
    description: SQL warehouse ID for alerts and monitoring queries
  git_branch:
    description: Git branch for job notebook source
    default: dev
  experiment_name:
    description: MLflow experiment path for training runs
    default: /Shared/advisor-risk-experiment
  notify_email:
    description: Email address for alert and job failure notifications
    default: siva.borusu@jrvs.ca
  monitoring_assets_dir:
    description: Workspace folder for the quality monitor dashboard (separate per target so dev/prod never overwrite each other)
    default: /Workspace/Shared/advisor-risk-mlops/dev/monitoring_assets

# ── Targets ────────────────────────────────────────────────────────
# Both targets use the same workspace; environment isolation is at
# the catalog level (mlops vs mlops_prod). This demonstrates how
# a single bundle handles multi-environment promotion without any
# manual work — only the variables change.
targets:
  dev:
    default: true
    mode: development
    # dev mode auto-prefixes job/pipeline names with [dev <user>]
    variables:
      catalog: mlops
      schema: siva_borusu
      warehouse_id: "960eea0736a2e75b"
      git_branch: dev
      experiment_name: /Shared/advisor-risk-experiment
      monitoring_assets_dir: /Workspace/Shared/advisor-risk-mlops/dev/monitoring_assets

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/siva.borusu@jrvs.ca/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mlops_prod
      schema: siva_borusu
      endpoint_name: advisor-risk-model-prod
      warehouse_id: "960eea0736a2e75b"
      git_branch: main
      experiment_name: /Shared/advisor-risk-experiment-prod
      monitoring_assets_dir: /Workspace/Shared/advisor-risk-mlops-prod/monitoring_assets
    run_as:
      user_name: siva.borusu@jrvs.ca
