# Prediction distribution shift (PSI) alert.
# Fires when the prediction column's PSI exceeds 0.2 vs the PREVIOUS window
# (CONSECUTIVE drift). The training baseline has no prediction column, so
# baseline drift is not available for predictions.
# Source: Lakehouse Monitor output table _drift_metrics.
# Evaluation: MAX(psi) across the returned rows > 0.2 triggers the alert.
# The query returns the raw PSI values (no threshold in SQL) so the alert
# condition, not the WHERE clause, owns the 0.2 cutoff and the PSI value
# shows up in the notification. No rows (monitor has not refreshed) = OK.
# Schedule: daily at 08:30 ET (30 min after the monitor's 08:00 refresh).
resources:
  alerts:
    prediction_psi_alert:
      display_name: "[${bundle.target}] Advisor Risk - Prediction PSI Shift"
      query_text: |
        SELECT
          window.start  AS window_start,
          window.end    AS window_end,
          granularity,
          population_stability_index AS psi,
          wasserstein_distance
        FROM ${var.catalog}.${var.schema}.${var.monitored_table}_drift_metrics
        WHERE drift_type = 'CONSECUTIVE'
          AND column_name = 'prediction'
          AND slice_key IS NULL
          AND window.start >= current_date() - INTERVAL 1 DAY
          AND population_stability_index IS NOT NULL
        ORDER BY population_stability_index DESC
      warehouse_id: ${var.warehouse_id}

      evaluation:
        comparison_operator: "GREATER_THAN"
        source:
          name: "psi"
          display: "psi"
          aggregation: "MAX"
        threshold:
          value:
            double_value: 0.2
        empty_result_state: "OK"
        notification:
          notify_on_ok: false
          subscriptions:
            - user_email: ${var.notify_email}

      schedule:
        pause_status: "UNPAUSED"
        quartz_cron_schedule: "0 30 8 * * ?"
        timezone_id: "America/Toronto"
