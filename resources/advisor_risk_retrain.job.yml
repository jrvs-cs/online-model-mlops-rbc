# Retraining pipeline — runs AFTER a champion model is registered AND the
# endpoint (${var.endpoint_name}) exists. The endpoint is created only by a manual
# deploy.py run with run_type=training; this job's deploy task (run_type=retraining)
# fails if the endpoint is missing.
# Initial model development is interactive (run the README Quick Start steps,
# incl. src/models/experimentation_optuna_mlflow_tracking).
# This job rebuilds features, re-tunes + retrains on fresh data (evaluation
# happens inside training via Optuna CV + held-out test metrics), registers the
# best model as @challenger, wraps it as pyfunc, and redeploys the endpoint
# (50/50 champion/challenger). Promotion to @champion is decided by the A/B test.
#
# Drift-gated: check_drift (same logic as feature_drift.alert.yml) -> retrain_needed
# (condition task) -> retraining tasks run only if drift was found or force_retrain=true.
# Schedule: weekly Monday 06:00 ET.
# Source: Git — jobs checkout ${var.git_branch} at runtime (dev or main).
resources:
  jobs:
    advisor_risk_retrain:
      name: "[${bundle.target}] Advisor Risk - Retrain"

      # ── Git source — checkout the target branch at runtime ───────
      git_source:
        git_url: https://github.com/jrvs-cs/online-model-mlops-rbc.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      # ── Shared job cluster (ML Runtime for lightgbm + mlflow + optuna) ──
      # Same runtime as the interactive cluster so the pyfunc pip pins
      # (mlflow / scikit-learn / lightgbm) match the training environment.
      job_clusters:
        - job_cluster_key: ml_cluster
          new_cluster:
            kind: CLASSIC_PREVIEW
            spark_version: "19.x-scala2.13"
            use_ml_runtime: true
            node_type_id: "Standard_DS3_v2"
            num_workers: 1
            data_security_mode: "SINGLE_USER"
            custom_tags:
              project: "advisor-risk-mlops"
              environment: "${bundle.target}"

      # ── Job-level parameters (shared across all tasks) ────────
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: model_name
          default: ${var.model_name}
        - name: endpoint_name
          default: ${var.endpoint_name}
        # MLflow experiment for training runs (separate per target)
        - name: experiment_name
          default: ${var.experiment_name}
        # Alias given to the newly trained model (train + pyfunc_wrapper).
        # Retraining always registers a challenger; promotion happens in the A/B test.
        - name: model_alias
          default: challenger
        # deploy.py: retraining -> add @challenger next to the serving champion (50/50).
        # Manual runs default to training -> @champion only (100%).
        - name: run_type
          default: retraining
        # Drift gate (check_drift): "true" skips the drift check and always retrains (manual runs).
        - name: force_retrain
          default: "false"
        # Drift gate: how many days of _drift_metrics windows to check (job runs weekly).
        - name: drift_lookback_days
          default: "7"

      tasks:
        # ── Drift gate: same check as feature_drift.alert.yml → task value `retrain` ──
        - task_key: check_drift
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: src/monitoring/check_drift
            source: GIT

        - task_key: retrain_needed
          depends_on:
            - task_key: check_drift
          condition_task:
            left: "{{tasks.check_drift.values.retrain}}"
            op: EQUAL_TO
            right: "true"

        # ── Feature engineering (training table + serving lookup table) ──
        - task_key: build_features
          depends_on:
            - task_key: retrain_needed
              outcome: "true"
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: src/feature_engineering/build_features
            source: GIT

        # ── Model training (Optuna tuning + register best) + evaluation ──
        - task_key: train
          depends_on:
            - task_key: build_features
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: src/models/experimentation_optuna_mlflow_tracking
            source: GIT

        - task_key: pyfunc_wrapper
          depends_on:
            - task_key: train
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: src/models/pyfunc_wrapper.py
            source: GIT

        # ── Deployment ────────────────────────────────────────────
        - task_key: deploy
          depends_on:
            - task_key: pyfunc_wrapper
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: src/serving/deploy.py
            source: GIT

      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: "America/Toronto"

      email_notifications:
        on_failure:
          - ${var.notify_email}
