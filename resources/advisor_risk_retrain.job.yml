# Retraining pipeline — runs AFTER a champion model is already registered.
# Initial model development is interactive (use notebooks/eda + src/models/train).
# This job retrains on fresh data, evaluates against the sitting champion,
# auto-promotes if better, and redeploys the endpoint.
#
# Schedule: weekly Monday 06:00 ET, or triggered by drift alerts via webhook.
# Source: Git — jobs checkout ${var.git_branch} at runtime (dev or main).
resources:
  jobs:
    advisor_risk_retrain:
      name: "[${bundle.target}] Advisor Risk - Retrain"

      # ── Git source — checkout the target branch at runtime ───────
      git_source:
        git_url: https://github.com/siva-borusu-jrvs/fraud-model-mlops.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      # ── Shared job cluster (ML Runtime for lightgbm + mlflow) ────
      job_clusters:
        - job_cluster_key: ml_cluster
          new_cluster:
            spark_version: "15.4.x-cpu-ml-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 1
            data_security_mode: "SINGLE_USER"
            custom_tags:
              project: "advisor-risk-mlops"
              environment: "${bundle.target}"

      # ── Job-level parameters (shared across all tasks) ────────
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: model_name
          default: ${var.model_name}
        - name: endpoint_name
          default: ${var.endpoint_name}

      tasks:
        # ── Model training + evaluation ───────────────────────────
        - task_key: train
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: src/models/train.py
            source: GIT

        - task_key: pyfunc_wrapper
          depends_on:
            - task_key: train
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: src/models/pyfunc_wrapper.py
            source: GIT

        - task_key: evaluate
          depends_on:
            - task_key: pyfunc_wrapper
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: src/models/evaluate.py
            source: GIT

        # ── Deployment ────────────────────────────────────────────
        - task_key: deploy
          depends_on:
            - task_key: evaluate
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: src/serving/deploy.py
            source: GIT

      schedule:
        quartz_cron_expression: "0 0 6 ? * MON"
        timezone_id: "America/Toronto"

      email_notifications:
        on_failure:
          - ${var.notify_email}
