# A/B test resolution — runs SEPARATELY from the retrain pipeline.
# After deploy.py puts champion + challenger on the endpoint at 50/50,
# this job checks production metrics and resolves the split:
# archive the loser, promote the winner, drive 100% traffic.
#
# Schedule: weekly Friday 09:00 ET (gives the 50/50 split ~1 week to collect data
# since retrain deploys on Monday 06:00 ET).
resources:
  jobs:
    ab_test_resolution:
      name: "[${bundle.target}] Advisor Risk - A/B Test Resolution"

      git_source:
        git_url: https://github.com/siva-borusu-jrvs/fraud-model-mlops.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      job_clusters:
        - job_cluster_key: ml_cluster
          new_cluster:
            spark_version: "15.4.x-cpu-ml-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 1
            data_security_mode: "SINGLE_USER"
            custom_tags:
              project: "advisor-risk-mlops"
              environment: "${bundle.target}"

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: model_name
          default: ${var.model_name}
        - name: endpoint_name
          default: ${var.endpoint_name}

      tasks:
        - task_key: resolve_ab_test
          job_cluster_key: ml_cluster
          notebook_task:
            notebook_path: src/serving/ab_test.py
            source: GIT

      schedule:
        quartz_cron_expression: "0 0 9 ? * FRI"
        timezone_id: "America/Toronto"

      email_notifications:
        on_failure:
          - ${var.notify_email}
