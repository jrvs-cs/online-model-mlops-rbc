# Feature drift vs baseline (KS / chi-squared).
# Fires when ANY feature shows statistically significant drift
# against the baseline (p-value < 0.05).
# Source: Lakehouse Monitor output table _drift_metrics.
# Schedule: daily at 08:30 ET (30 min after the monitor's 08:00 refresh).
resources:
  alerts:
    feature_drift_alert:
      display_name: "[${bundle.target}] Advisor Risk - Feature Drift vs Baseline"
      query_text: |
        SELECT
          window.start   AS window_start,
          window.end     AS window_end,
          column_name,
          granularity,
          ks_test.statistic           AS ks_statistic,
          ks_test.pvalue              AS ks_pvalue,
          chi_squared_test.statistic  AS chi2_statistic,
          chi_squared_test.pvalue     AS chi2_pvalue
        FROM ${var.catalog}.${var.schema}.${var.monitored_table}_drift_metrics
        WHERE drift_type = 'BASELINE'
          AND slice_key IS NULL
          -- features only: exclude label, table-level row, IDs and inference metadata
          AND column_name NOT IN (
            'at_risk', ':table', 'Salesforce_Id__c', 'inference_id',
            'served_model', 'model_version', 'prediction', 'prediction_probability'
          )
          AND window.start >= current_date() - INTERVAL 1 DAY
          AND (
            ks_test.pvalue < 0.05
            OR chi_squared_test.pvalue < 0.05
          )
        ORDER BY COALESCE(ks_test.pvalue, chi_squared_test.pvalue) ASC
        LIMIT 1
      warehouse_id: ${var.warehouse_id}

      evaluation:
        comparison_operator: "GREATER_THAN"
        source:
          name: "window_start"
          display: "window_start"
        threshold:
          value:
            double_value: 0.0
        notification:
          notify_on_ok: false
          subscriptions:
            - user_email: ${var.notify_email}
            # Add webhook destination to trigger retrain job:
            # - destination_id: "<webhook-destination-id>"

      schedule:
        pause_status: "UNPAUSED"
        quartz_cron_schedule: "0 30 8 * * ?"
        timezone_id: "America/Toronto"
